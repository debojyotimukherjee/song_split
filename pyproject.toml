[project]
name = "weekend-stems"
version = "0.1.0"
description = "Local-first music stem separation pipeline for Weekend Stems."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
